<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Login / Sign Up | CodeCrafix</title>
<meta name="description" content="Login or create your free CodeCrafix account to book app publishing, AdMob setup and custom development services, and track everything in your dashboard.">
<meta name="author" content="Vivek Barman">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://codecrafix.shop/login">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261004d">
<link rel="stylesheet" href="assets/css/theme-v2.css?v=20261125h">
<style>
  .auth-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:64px 20px;background:linear-gradient(180deg,#f2faf5,#ffffff)}
  .auth-card{background:#ffffff;border:1px solid #e3efe7;border-radius:22px;box-shadow:0 30px 60px rgba(6,40,24,.10);max-width:460px;width:100%;padding:40px 38px;text-align:center}
  .auth-card img{width:56px;height:56px}
  .auth-card h1{font-family:Poppins,Inter,sans-serif;font-size:1.65rem;font-weight:700;color:#0b1220;margin:14px 0 6px}
  .auth-card .sub{color:#42534a;font-size:.95rem;line-height:1.55;margin-bottom:26px}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;border:1.5px solid #d8e4dc;border-radius:12px;background:#ffffff;font-weight:600;font-size:.98rem;color:#1f2937;cursor:pointer;transition:.2s}
  .btn-google:hover{border-color:#0a7a4b;box-shadow:0 8px 20px rgba(6,40,24,.08)}
  .auth-div{display:flex;align-items:center;gap:14px;margin:24px 0;color:#84968c;font-size:.8rem;font-weight:600;letter-spacing:.08em}
  .auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:#e3efe7}
  .auth-tabs{display:flex;background:#eef6f1;border-radius:12px;padding:4px;margin-bottom:22px}
  .auth-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;font-size:.92rem;color:#42534a;cursor:pointer}
  .auth-tabs button.on{background:#ffffff;color:#0a7a4b;box-shadow:0 4px 12px rgba(6,40,24,.10)}
  .auth-form{text-align:left}
  .auth-form .field{margin-bottom:15px}
  .auth-form label{display:block;font-weight:600;font-size:.88rem;color:#0b1220;margin-bottom:6px}
  .auth-form input{width:100%;padding:12px 14px;border:1.5px solid #d8e4dc;border-radius:11px;font-size:.96rem;font-family:Inter,sans-serif;color:#0b1220;background:#ffffff}
  .auth-form input:focus{outline:none;border-color:#0a7a4b;box-shadow:0 0 0 3px rgba(10,122,75,.14)}
  .auth-msg{border-radius:11px;padding:12px 14px;font-size:.9rem;margin-bottom:15px;display:none;text-align:left}
  .auth-msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .auth-msg.ok{display:block;background:#ecfdf3;border:1px solid #bbe9c9;color:#065f46}
  .auth-note{margin-top:20px;font-size:.8rem;color:#61766a;line-height:1.55}
  .auth-note a{color:#0a7a4b;font-weight:600}
</style>
</head>
<body>
<header id="cf-header"></header>
<main>
  <section class="auth-wrap">
    <div class="auth-card">
      <img src="assets/img/logo.svg" alt="CodeCrafix">
      <h1>Welcome to CodeCrafix</h1>
      <p class="sub">Login to book services, track your apps and manage everything from your own dashboard.</p>
      <button type="button" class="btn-google" id="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </button>
      <div class="auth-div">OR WITH EMAIL</div>
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="on">Login</button>
        <button type="button" id="tab-signup">Create account</button>
      </div>
      <div class="auth-msg" id="auth-msg"></div>
      <form class="auth-form" id="auth-form" novalidate>
        <div class="field" id="f-name" style="display:none"><label for="au-name">Your name</label><input id="au-name" type="text" placeholder="e.g. Aarav Mehta" autocomplete="name"></div>
        <div class="field"><label for="au-email">Email</label><input id="au-email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="field"><label for="au-pass">Password</label><input id="au-pass" type="password" placeholder="Minimum 6 characters" autocomplete="current-password" required></div>
        <button class="btn btn-primary btn-block" type="submit" id="auth-submit" style="width:100%;padding:14px;font-size:1rem">Login</button>
      </form>
      <p class="auth-note">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.<br>Only Contact and Reviews work without an account — everything else needs a free login.</p>
    </div>
  </section>
</main>
<footer id="cf-footer"></footer>
<script src="assets/js/config.js?v=20261004n"></script>
<script src="assets/js/app.js?v=20261004c"></script>
<script src="assets/js/auth.js?v=1"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var BASE = window.CF_AUTH ? CF_AUTH.base : '', KEY = window.CF_AUTH ? CF_AUTH.key : '';
  var mode = 'login';
  var msg = document.getElementById('auth-msg');
  function nextUrl() {
    var n = new URLSearchParams(location.search).get('next') || 'dashboard.html';
    return /^[a-z0-9\-]+\.html$/i.test(n) ? n : 'dashboard.html';
  }
  function show(text, ok) { msg.textContent = text; msg.className = 'auth-msg ' + (ok ? 'ok' : 'err'); }
  function setMode(m) {
    mode = m;
    document.getElementById('tab-login').classList.toggle('on', m === 'login');
    document.getElementById('tab-signup').classList.toggle('on', m === 'signup');
    document.getElementById('f-name').style.display = m === 'signup' ? '' : 'none';
    document.getElementById('auth-submit').textContent = m === 'signup' ? 'Create free account' : 'Login';
    msg.className = 'auth-msg'; msg.textContent = '';
  }
  document.getElementById('tab-login').addEventListener('click', function () { setMode('login'); });
  document.getElementById('tab-signup').addEventListener('click', function () { setMode('signup'); });
  if (new URLSearchParams(location.search).get('mode') === 'signup') { setMode('signup'); }
  if (window.CF_AUTH && CF_AUTH.user()) { location.replace(nextUrl()); }
  window.CF_ON_AUTH = function () { location.replace(nextUrl()); };
  /* Google login via Google Identity Services: the sign-in popup opens from
     codecrafix.shop with our own Google client, so Google shows "CodeCrafix"
     (not the Supabase project address). The ID token is exchanged with
     Supabase directly (grant_type=id_token). Fallback: classic redirect flow. */
  var GOOGLE_CLIENT_ID = '1006074689063-jud76qvp509ieco0pvpu2ha7r9ingp4j.apps.googleusercontent.com';
  var gisReady = false, rawNonce = '';
  function oldGoogleFlow() {
    location.href = BASE + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + '/dashboard.html');
  }
  function sha256hex(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function onGoogleCredential(resp) {
    if (!resp || !resp.credential) { show('Google login cancel ho gaya. Dobara try karo.'); return; }
    show('Google se login ho raha hai…', true);
    fetch(BASE + '/auth/v1/token?grant_type=id_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: 'google', id_token: resp.credential, nonce: rawNonce }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.access_token) {
          d.expires_at = Math.floor(Date.now() / 1000) + (d.expires_in || 3600);
          CF_AUTH.setSession(d); location.replace(nextUrl());
        } else {
          show((d && (d.error_description || d.msg || d.message)) || 'Google login nahi ho paya. Dobara try karo.');
        }
      })
      .catch(function () { show('Network error. Dobara try karo.'); });
  }
  document.getElementById('btn-google').addEventListener('click', function () {
    if (!window.google || !google.accounts || !google.accounts.id) { oldGoogleFlow(); return; }
    function openPrompt() {
      google.accounts.id.prompt(function (n) {
        if (n.isNotDisplayed() || n.isSkippedMoment()) { oldGoogleFlow(); }
      });
    }
    if (gisReady) { openPrompt(); return; }
    var bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
    rawNonce = Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    sha256hex(rawNonce).then(function (hashed) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential, nonce: hashed, auto_select: false, cancel_on_tap_outside: true });
      gisReady = true;
      openPrompt();
    }).catch(oldGoogleFlow);
  });
  document.getElementById('auth-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('au-email').value.trim();
    var pass = document.getElementById('au-pass').value;
    var name = document.getElementById('au-name').value.trim();
    if (!email || pass.length < 6) { show('Email aur kam se kam 6 character ka password daalo.'); return; }
    var btn = document.getElementById('auth-submit'); btn.disabled = true; btn.textContent = 'Please wait…';
    var url, body;
    if (mode === 'signup') { url = BASE + '/auth/v1/signup'; body = { email: email, password: pass, data: { full_name: name } }; }
    else { url = BASE + '/auth/v1/token?grant_type=password'; body = { email: email, password: pass }; }
    fetch(url, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false; btn.textContent = mode === 'signup' ? 'Create free account' : 'Login';
        if (d && d.access_token) {
          d.expires_at = Math.floor(Date.now() / 1000) + (d.expires_in || 3600);
          CF_AUTH.setSession(d); location.replace(nextUrl());
        } else if (mode === 'signup' && d && d.id) {
          show('Account ban gaya! Email par ek confirmation link gaya hai — usse verify karke yahan login karo.', true);
          setMode('login');
        } else {
          show((d && (d.error_description || d.msg || d.message)) || 'Kuch gadbad ho gayi. Dobara try karo.');
        }
      })
      .catch(function () { btn.disabled = false; btn.textContent = mode === 'signup' ? 'Create free account' : 'Login'; show('Network error. Dobara try karo.'); });
  });
})();
</script>
</body>
</html>
